# One non-default PostgreSQL version profile. Devkit starts this file under a stable profile-specific
# Compose project and supplies an exact image tag, loopback port and named volume.
services:
  database:
    image: ${DEVKIT_DATABASE_IMAGE:?exact PostgreSQL image is required}
    restart: always
    ports:
      - "127.0.0.1:${DEVKIT_DATABASE_PORT:?database port is required}:5432"
    environment:
      POSTGRES_USER: ${DEVKIT_DATABASE_USER:?database user is required}
      POSTGRES_PASSWORD: ${DEVKIT_DATABASE_PASSWORD:?database password is required}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEVKIT_DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - database:/var/lib/postgresql/data

volumes:
  database:
    name: ${DEVKIT_DATABASE_VOLUME:?database volume is required}
