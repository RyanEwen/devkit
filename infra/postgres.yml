# PostgreSQL owned by one checkout. Application services join this Compose project, so the
# database stays private to its network and needs no host port.
services:
  database:
    image: ${DEVKIT_DATABASE_IMAGE:?exact PostgreSQL image is required}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DEVKIT_DATABASE_USER:?database user is required}
      POSTGRES_PASSWORD: ${DEVKIT_DATABASE_PASSWORD:?database password is required}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEVKIT_DATABASE_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data
      - ${DEVKIT_BASELINE_DIR:?baseline directory must be set}:/devkit-baselines

volumes:
  database:
    name: ${DEVKIT_DATABASE_VOLUME:?database volume is required}
