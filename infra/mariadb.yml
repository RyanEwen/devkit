# MariaDB owned by one checkout. Application services join this Compose project, so the database
# stays private to its network and needs no host port.
services:
  database:
    image: ${DEVKIT_DATABASE_IMAGE:?exact MariaDB image is required}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --max-allowed-packet=64M
      - --default-time-zone=America/New_York
    environment:
      TZ: America/New_York
      MARIADB_ROOT_PASSWORD: ${DEVKIT_DATABASE_PASSWORD:?database password is required}
      MYSQL_ROOT_PASSWORD: ${DEVKIT_DATABASE_PASSWORD:?database password is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/mysql
      - ${DEVKIT_BASELINE_DIR:?baseline directory must be set}:/devkit-baselines

volumes:
  database:
    name: ${DEVKIT_DATABASE_VOLUME:?database volume is required}
