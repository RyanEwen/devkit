# Shared developer infrastructure: one proxy. Every checkout owns its database container.
#
# Deliberately NOT referenced by anything in the repo's own Compose files. In particular there is no
# `external: true` network anywhere in this design: a missing external network makes `docker compose
# up` fail outright, so a contributor who never opted into this mode would be broken by
# infrastructure they were never told about. Traefik reaches host processes over
# `host.docker.internal` instead, which needs no shared network at all.
#
# Bound to both IPv4 and IPv6 loopback. These carry a throwaway password and no auth, so they must
# not be reachable from the LAN. Some browsers resolve *.localhost to ::1 without falling back to
# 127.0.0.1, while Docker Desktop exposes WSL loopback listeners to Windows on both protocols.

services:
  # Routes `<worktree>.<repo>.localhost` to whichever host port that checkout's Vite is on. Routes
  # are generated files under ./routes (see src/proxy.mjs), watched and hot-reloaded, so
  # starting a second checkout never interrupts the first.
  proxy:
    # Floating major tag on purpose: this is dev-only infrastructure that wants Traefik's v3
    # security updates, and pinning an exact patch here would mean pinning whatever was current when
    # this file was written. Pin one if you ever need a reproducible proxy.
    image: traefik:v3
    # The project lifecycle starts this on first use and removes it after the final route closes.
    # A restart policy would resurrect an unused proxy whenever Docker Desktop starts.
    restart: "no"
    ports:
      - "127.0.0.1:${DEVKIT_PROXY_PORT:-80}:80"
      - "[::1]:${DEVKIT_PROXY_PORT:-80}:80"
    volumes:
      - ${DEVKIT_ROUTES_DIR:?routes directory must be set}:/routes:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    # Lets a container-side route reach a dev server running on the host. Docker Desktop provides
    # this name natively; the explicit host-gateway mapping is what makes it resolve on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
