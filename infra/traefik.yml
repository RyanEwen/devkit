# Traefik static configuration for the shared dev proxy. Mounted read-only by infra/compose.yml.
#
# File provider rather than the Docker provider: the things being routed to are dev servers running
# on the HOST, which Docker cannot discover. `scripts/dev/host-mode/proxy.mjs` writes one file per
# running checkout into the watched directory; Traefik hot-reloads, so no restart is ever needed.
#
# The private upstream is HTTP. Browsers trust HTTP on *.localhost; remote secondary domains
# can use HTTPS terminated by an existing nginx server, with their public scheme configured
# in host.json. Bootstrap renders the entry point address for optional native Linux host mode.

entryPoints:
  web:
    address: ":80"

providers:
  file:
    directory: /routes
    watch: true

# Dev-only posture: the dashboard is off and no API is exposed. Nothing here should be reachable
# beyond the loopback bind in compose.yml.
api:
  dashboard: false

log:
  level: WARN

# No `accessLog` key on purpose. Access logging is OFF unless the key is present (an empty
# `accessLog: {}` would switch it ON with defaults), and every asset request and HMR websocket frame
# would otherwise land in `docker logs`, drowning the occasional routing error worth reading.
